<!DOCTYPE html>
<html lang="es" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panorama F&S — Control de Contenedores</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c97a00'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='14' fill='white' text-anchor='middle'%3EIP%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23c97a00'/%3E%3Ctext x='90' y='122' font-family='Arial' font-weight='700' font-size='80' fill='white' text-anchor='middle'%3EIP%3C/text%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contenedores">
<style>
:root{
  --bg:#0b1120;--s1:#111827;--s2:#1a2236;--s3:#243050;--s4:#2e3d5c;
  --bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.13);
  --tx:#e8edf5;--tx2:#94a3b8;--tx3:#64748b;
  --blue:#4f87ff;--blue-d:#1d4ed8;--blue-bg:rgba(79,135,255,.12);
  --green:#10b981;--green-bg:rgba(16,185,129,.14);
  --red:#ef4444;--red-bg:rgba(239,68,68,.14);
  --amber:#f59e0b;--amber-bg:rgba(245,158,11,.14);
  --teal:#06b6d4;--teal-bg:rgba(6,182,212,.14);
  --purple:#a78bfa;--purple-bg:rgba(167,139,250,.14);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --mono:'SF Mono','SFMono-Regular','Consolas','Liberation Mono','Menlo',monospace;
  --r:10px;--rs:6px;
  --sh:0 1px 4px rgba(0,0,0,.4);
}
/* ── Light theme ── */
.light{
  --bg:#f0f4f8;--s1:#ffffff;--s2:#e8edf5;--s3:#dde3ee;--s4:#cdd5e0;
  --bd:rgba(0,0,0,.09);--bd2:rgba(0,0,0,.16);
  --tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;
  --blue:#1d4ed8;--blue-bg:rgba(29,78,216,.09);
  --green:#059669;--green-bg:rgba(5,150,105,.10);
  --red:#dc2626;--red-bg:rgba(220,38,38,.10);
  --amber:#b45309;--amber-bg:rgba(180,83,9,.10);
  --teal:#0891b2;--teal-bg:rgba(8,145,178,.10);
  --purple:#7c3aed;--purple-bg:rgba(124,58,237,.10);
  --sh:0 1px 3px rgba(0,0,0,.10),0 1px 8px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px;min-height:100vh;transition:background .25s,color .25s}
 
/* ── Theme toggle ── */
.theme-toggle{position:relative;display:flex;align-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.theme-toggle input{position:absolute;opacity:0;width:0;height:0}
.toggle-track{width:56px;height:28px;border-radius:14px;background:linear-gradient(135deg,#1e3a5f,#0b1120);transition:background .35s ease;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.35);border:1.5px solid rgba(255,255,255,.1)}
.light .toggle-track{background:linear-gradient(135deg,#f97316,#f59e0b);border-color:rgba(255,255,255,.3);box-shadow:0 2px 8px rgba(249,115,22,.4)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;line-height:1;transition:transform .35s cubic-bezier(.34,1.56,.64,1);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.light .toggle-thumb{transform:translateX(28px)}
 
/* ── Header ── */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:60px;background:var(--s1);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100;transition:background .25s,border-color .25s}
.hdr-l{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;background:#c97a00;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0;letter-spacing:-.5px}
.h-title{font-size:15px;font-weight:600;letter-spacing:-.2px;color:var(--tx)}
.h-sub{font-size:11px;color:var(--tx3);margin-top:1px;font-family:var(--mono)}
.hdr-r{display:flex;align-items:center;gap:10px}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tx3);font-family:var(--mono);padding:4px 10px;background:var(--s2);border:1px solid var(--bd);border-radius:20px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.btn-ref{background:var(--s2);border:1px solid var(--bd2);color:var(--tx2);padding:6px 14px;border-radius:var(--rs);font-size:12px;font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:5px;font-weight:500;transition:all .15s}
.btn-ref:hover{background:var(--s3);color:var(--tx)}
.btn-cfg{background:none;border:none;color:var(--tx3);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:var(--rs);transition:color .15s;line-height:1}
.btn-cfg:hover{color:var(--tx2)}
 
/* ── Main ── */
.app{max-width:1200px;margin:0 auto;padding:24px 24px 60px}
 
/* ── KPI cards ── */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.kpi{border-radius:var(--r);padding:14px 16px;box-shadow:0 2px 12px rgba(0,0,0,.25);position:relative;overflow:hidden;border:none;cursor:default}
.kpi::after{content:'';position:absolute;top:-20px;right:-20px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.kpi-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:rgba(255,255,255,.75);margin-bottom:6px}
.kpi-val{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.1;color:#fff}
.kpi-sub{font-size:10px;color:rgba(255,255,255,.65);margin-top:4px}
.kpi.c-blue {background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
.kpi.c-green{background:linear-gradient(135deg,#059669,#10b981)}
.kpi.c-purple{background:linear-gradient(135deg,#6d28d9,#a78bfa)}
.kpi.c-amber{background:linear-gradient(135deg,#b45309,#f59e0b)}
 
/* ── Section heading ── */
.sh{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sh::after{content:'';flex:1;height:1px;background:var(--bd)}
 
/* ── Container cards ── */
.container-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;margin-bottom:12px;transition:border-color .15s,box-shadow .15s}
.container-card:hover{border-color:var(--bd2);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.container-card.arrived{opacity:.65}
.container-card.arrived:hover{opacity:1}
 
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-left{display:flex;align-items:center;gap:12px}
.product-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.product-icon.mango{background:rgba(245,158,11,.15)}
.product-icon.pineapple{background:rgba(16,185,129,.12)}
.bl-number{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:.02em;font-family:var(--mono)}
.bl-meta{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.card-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.days-left{font-size:15px;font-weight:700;font-family:var(--mono)}
.days-label{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
 
/* ── Badges ── */
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:600;font-family:var(--mono);white-space:nowrap}
.badge-size    {background:var(--blue-bg);color:var(--blue);border:1px solid rgba(79,135,255,.25)}
.badge-supplier{background:var(--s3);color:var(--tx2);border:1px solid var(--bd)}
.badge-status-paid   {background:var(--green-bg);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.badge-status-pending{background:var(--amber-bg);color:var(--amber);border:1px solid rgba(245,158,11,.3)}
.badge-arrived {background:var(--green-bg);color:var(--green);border:1px solid rgba(16,185,129,.3)}
.badge-customs {background:var(--purple-bg);color:var(--purple);border:1px solid rgba(167,139,250,.25)}
 
/* ── Freight logos ── */
.freight-logo{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:2px 8px;font-size:10px;font-weight:700;letter-spacing:.04em;font-family:var(--mono)}
.freight-wanhai{background:#0a1a4a;color:#88aaff;border:1px solid #1a3a90}
.freight-one   {background:#3b0000;color:#ff8888;border:1px solid #6b1c1c}
.freight-maersk{background:#001a30;color:#6bb8ff;border:1px solid #0a4060}
.freight-hapag {background:#3b0000;color:#ffd080;border:1px solid #7a2000}
.freight-coyote{background:#162000;color:#aadd44;border:1px solid #2e4400}
.light .freight-wanhai{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
.light .freight-one   {background:#fee2e2;color:#b91c1c;border-color:#fecaca}
.light .freight-maersk{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
.light .freight-hapag {background:#fef3c7;color:#92400e;border-color:#fde68a}
.light .freight-coyote{background:#ecfccb;color:#3f6212;border-color:#d9f99d}
 
/* ── Progress bar — two-stage ── */
.progress-container{position:relative;padding-bottom:4px}
.progress-track-wrap{position:relative;height:8px}
.track-bg{position:absolute;top:0;height:100%;background:var(--s3)}
.track-bg.seg-sea {left:0;width:70%;border-radius:4px 0 0 4px}
.track-bg.seg-land{left:70%;width:30%;border-radius:0 4px 4px 0}
.port-divider{position:absolute;left:70%;top:-3px;bottom:-3px;width:2px;background:var(--bd2);z-index:3;border-radius:1px}
.track-fill{position:absolute;top:0;height:100%;transition:width .6s ease}
.track-fill.seg-sea-fill {left:0;border-radius:4px 0 0 4px;background:linear-gradient(90deg,#1d4ed8,#4f87ff,#60a5fa);max-width:70%}
.track-fill.seg-land-fill{left:70%;border-radius:0 4px 4px 0;background:linear-gradient(90deg,#3a5500,#639922,#aadd44);max-width:30%}
.track-fill.seg-all-land {left:0;border-radius:4px;background:linear-gradient(90deg,#3a5500,#639922,#aadd44)}
.transit-icon{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:18px;z-index:5;transition:left .6s ease;pointer-events:none;line-height:1}
.transit-icon.mode-sea {filter:drop-shadow(0 0 4px rgba(79,135,255,.8))}
.transit-icon.mode-land{filter:drop-shadow(0 0 4px rgba(150,220,50,.8))}
 
/* ── Waypoints ── */
.waypoints{display:flex;justify-content:space-between;margin-top:18px}
.waypoint{text-align:center;font-size:9px;color:var(--tx3);flex:1;font-family:var(--mono);text-transform:uppercase;letter-spacing:.04em}
.waypoint.active     {color:var(--blue);font-weight:600}
.waypoint.active-land{color:#aadd44;font-weight:600}
.light .waypoint.active-land{color:#3f6212}
 
/* ── Dates row ── */
.dates-row{display:flex;gap:20px;margin-top:12px;flex-wrap:wrap}
.date-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3)}
.date-value{font-size:12px;color:var(--tx2);margin-top:2px;font-weight:500;font-family:var(--mono)}
.date-value.highlight{color:var(--blue)}
 
/* ── Arrived section ── */
.arrived-toggle{background:none;border:1px solid var(--bd);border-radius:var(--r);color:var(--tx2);font-size:13px;padding:10px 16px;cursor:pointer;width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;transition:all .15s;margin-bottom:12px;font-family:var(--font)}
.arrived-toggle:hover{border-color:var(--bd2);color:var(--tx);background:var(--s2)}
.arrived-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
 
/* ── Config panel ── */
.config-box{background:var(--s1);border:1px solid var(--bd2);border-radius:var(--r);padding:20px;max-width:500px;margin:40px auto;box-shadow:var(--sh)}
.config-box h3{font-size:15px;font-weight:600;margin-bottom:10px;color:var(--tx)}
.config-box p{font-size:12px;color:var(--tx2);margin-bottom:16px;line-height:1.6}
.config-input{width:100%;background:var(--s2);border:1px solid var(--bd2);border-radius:var(--rs);padding:7px 12px;color:var(--tx);font-size:12px;font-family:var(--mono);margin-bottom:12px;outline:none;transition:border-color .15s}
.config-input:focus{border-color:var(--blue)}
.config-btn{background:var(--blue);color:#fff;border:none;border-radius:var(--rs);padding:7px 16px;font-size:12px;font-family:var(--font);font-weight:500;cursor:pointer;transition:background .15s}
.config-btn:hover{background:var(--blue-d)}
.settings-btn{background:none;border:1px solid var(--bd);border-radius:var(--rs);padding:5px 10px;color:var(--tx3);font-size:12px;cursor:pointer;font-family:var(--font);transition:all .15s}
.settings-btn:hover{color:var(--tx2);border-color:var(--bd2)}
 
/* ── Loading / Error / Empty ── */
.loading-state{text-align:center;padding:60px 20px;color:var(--tx3)}
.loading-spinner{width:28px;height:28px;border:2px solid var(--bd2);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.error-state{background:var(--red-bg);border:1px solid rgba(239,68,68,.3);border-radius:var(--r);padding:12px 16px;color:var(--red);font-size:12px;margin-bottom:16px}
.empty-state{text-align:center;padding:40px;color:var(--tx3);font-size:13px}
 
/* ── Mobile ── */
@media(max-width:640px){
  .hdr{padding:0 14px;height:auto;min-height:52px;flex-wrap:wrap;gap:8px;padding-top:10px;padding-bottom:10px}
  .live-badge{display:none}
  .h-title{font-size:13px}
  .app{padding:12px 12px 40px}
  .kpi-grid{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
  .kpi-val{font-size:22px}
  .container-card{padding:12px}
  .card-top{flex-direction:column;gap:8px}
  .card-right{align-items:flex-start;flex-direction:row;flex-wrap:wrap;gap:8px}
  .days-label{display:none}
  .waypoints{display:none}
  .progress-track-wrap{height:10px}
  .transit-icon{font-size:16px}
  .dates-row{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
  .arrived-grid{grid-template-columns:1fr}
  .btn-ref span{display:none}
}
@supports(padding-bottom:env(safe-area-inset-bottom)){
  body{padding-bottom:env(safe-area-inset-bottom)}
  .hdr{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
}
</style>
</head>
<body>
 
<div class="hdr">
  <div class="hdr-l">
    <div class="logo">IP</div>
    <div>
      <div class="h-title">Panorama F&S — Contenedores</div>
      <div class="h-sub" id="last-update">Cargando...</div>
    </div>
  </div>
  <div class="hdr-r">
    <div class="live-badge"><div class="dot"></div>Google Sheets</div>
    <label class="theme-toggle" title="Cambiar tema">
      <input type="checkbox" id="theme-chk" onchange="toggleTheme(this)">
      <div class="toggle-track"><div class="toggle-thumb" id="toggle-thumb">🌙</div></div>
    </label>
    <button class="settings-btn btn-cfg" onclick="showConfig()" title="Configuración">⚙</button>
    <button class="btn-ref" onclick="loadData()">↻ <span>Actualizar</span></button>
  </div>
</div>
 
<div class="app">
  <div id="config-section" style="display:none">
    <div class="config-box">
      <h3>🔧 Configuración</h3>
      <p>Ingresa tu Google Sheets API Key y el ID del spreadsheet de Control de Contenedores.</p>
      <label style="font-size:12px;color:var(--text3);display:block;margin-bottom:4px">API Key (Google Sheets)</label>
      <input class="config-input" id="api-key-input" type="password" placeholder="AIzaSy...">
      <label style="font-size:12px;color:var(--text3);display:block;margin-bottom:4px">Sheet ID</label>
      <input class="config-input" id="sheet-id-input" type="text" placeholder="1OwptBPFNknYGorTUfmGdHUlvVb5ViAxck-UUT5AFgV4">
      <div style="display:flex;gap:8px;align-items:center">
        <button class="config-btn" onclick="saveConfig()">Guardar y cargar</button>
        <button class="settings-btn" onclick="hideConfig()">Cancelar</button>
        <button class="settings-btn" onclick="useDemoData()" style="margin-left:auto">Demo</button>
      </div>
    </div>
  </div>
 
  <div id="main-content">
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <div>Cargando datos...</div>
    </div>
  </div>
</div>
 
<script>
const SHEET_ID_DEFAULT = '1OwptBPFNknYGorTUfmGdHUlvVb5ViAxck-UUT5AFgV4';
const DATA_TAB = 'CONTROL CONTENEDORES';
 
// ─── DEMO DATA (mirrors real sheet: A=Carpeta, B=MP, C=Proveedor, D=BL, E=Naviera, F=ETD, G=ETA, H=Días Restantes, I=BL Pagado, J=Aduana)
// Dates in DD/MM/YYYY as they appear in the real sheet
const DEMO_DATA = [
  ['Carpeta','MP','Proveedor','BL','Naviera','ETD','ETA','Días Restantes','BL Pagado','Aduana'],
  ['C25 - APF WAN HAI 035GX20828','Piña 20ft','APF','035GX20828','WAN HAI','15/4/2026','27/5/2026','11','FALSE','FALSE'],
  ['C26 - APF MAERSK DEMO123','Mango 40ft','APF','DEMO123456','MAERSK','1/5/2026','7/6/2026','22','FALSE','FALSE'],
  ['C27 - GCF ONE DEMO456','Piña 40ft','GCF','DEMO456789','ONE','10/5/2026','20/6/2026','35','FALSE','FALSE'],
  ['C28 - Capitol COYOTE DEMO','Mango 20ft','Capitol','COYOTE2026','COYOTE','14/5/2026','17/5/2026','1','TRUE','FALSE'],
  ['C21 - GCF WAN HAI 035FX66095','Mango 20ft','GCF','035FX66095','WAN HAI','28/10/2025','12/12/2025','EN PLANTA','TRUE','TRUE'],
  ['C22 - GCF WAN HAI 035FX73611','Mango 20ft','GCF','035FX73611','WAN HAI','7/12/2025','21/1/2026','EN PLANTA','TRUE','TRUE'],
  ['C23 - GCF WAN HAI 035FX73279','Mango 20ft','GCF','035FX73279','WAN HAI','26/12/2025','18/2/2026','EN PLANTA','TRUE','TRUE'],
  ['GCF WAN HAI 035FX80156 (PIÑA)','Piña 40ft','GCF','035FX80156','WAN HAI','9/1/2026','4/3/2026','EN PLANTA','TRUE','TRUE'],
];
 
// ─── STATE ────────────────────────────────────────────────────────────────
let containers = [];
let arrivedOpen = false;
 
function getConfig() {
  return {
    apiKey: localStorage.getItem('pan_containers_key') || '',
    sheetId: localStorage.getItem('pan_containers_sheet') || SHEET_ID_DEFAULT,
  };
}
 
function saveConfig() {
  const key = document.getElementById('api-key-input').value.trim();
  const id = document.getElementById('sheet-id-input').value.trim() || SHEET_ID_DEFAULT;
  localStorage.setItem('pan_containers_key', key);
  localStorage.setItem('pan_containers_sheet', id);
  hideConfig();
  loadData();
}
 
function showConfig() {
  const cfg = getConfig();
  document.getElementById('api-key-input').value = cfg.apiKey;
  document.getElementById('sheet-id-input').value = cfg.sheetId;
  document.getElementById('config-section').style.display = 'block';
  document.getElementById('main-content').style.display = 'none';
}
 
function hideConfig() {
  document.getElementById('config-section').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
}
 
function useDemoData() {
  hideConfig();
  processRows(DEMO_DATA);
}
 
// ─── LOAD DATA ────────────────────────────────────────────────────────────
async function loadData() {
  const cfg = getConfig();
  setContent('<div class="loading-state"><div class="loading-spinner"></div><div>Conectando con Google Sheets...</div></div>');
 
  if (!cfg.apiKey) {
    processRows(DEMO_DATA);
    showError('Sin API Key configurada — mostrando datos demo. Haz clic en ⚙ Config para conectar tu hoja real.');
    return;
  }
 
  try {
    // Pull full rows A:K — A=Carpeta, B=MP, C=Proveedor, D=BL, E=Naviera, F=ETD, G=ETA, H=Días, I=BL Pagado, J=Aduana
    const range = `'CONTROL CONTENEDORES'!A1:K200`;
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${cfg.sheetId}/values/${encodeURIComponent(range)}?key=${cfg.apiKey}&valueRenderOption=FORMATTED_VALUE&dateTimeRenderOption=FORMATTED_STRING`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const rows = data.values || [];
    if (!rows.length) throw new Error('Sin datos en la hoja');
    processRows(rows); // row[0] is header
    document.getElementById('last-update').textContent = `Actualizado ${new Date().toLocaleTimeString('es-MX', {hour:'2-digit',minute:'2-digit'})} · Google Sheets`;
  } catch(e) {
    processRows(DEMO_DATA);
    showError(`Error al cargar: ${e.message} — mostrando datos demo.`);
  }
}
 
function showError(msg) {
  const existing = document.getElementById('error-banner');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.id = 'error-banner';
  el.className = 'error-state';
  el.textContent = '⚠ ' + msg;
  document.querySelector('.main').insertBefore(el, document.getElementById('main-content'));
}
 
function setContent(html) {
  document.getElementById('main-content').innerHTML = html;
}
 
// ─── DATE PARSING — handles DD/M/YYYY, D/MM/YYYY, YYYY-MM-DD ─────────────
function parseDate(str) {
  if (!str) return null;
  str = String(str).trim();
  // ISO format
  if (/^\d{4}-\d{2}-\d{2}/.test(str)) return new Date(str);
  // DD/MM/YYYY or D/M/YYYY (Mexican format from Sheets)
  const parts = str.split('/');
  if (parts.length === 3) {
    const [d, m, y] = parts.map(Number);
    if (y > 1000) return new Date(y, m - 1, d);
  }
  return null;
}
 
function isChecked(val) {
  if (!val) return false;
  const v = String(val).toUpperCase().trim();
  return v === 'TRUE' || v === 'VERDADERO' || v === '1' || v === 'SI' || v === 'SÍ' || v === '☑' || v === 'TRUE';
}
 
// ─── PROCESS ROWS ─────────────────────────────────────────────────────────
// Real sheet columns: A=Carpeta(0), B=MP(1), C=Proveedor(2), D=BL(3),
//   E=Naviera(4), F=ETD(5), G=ETA(6), H=Días Restantes(7), I=BL Pagado(8), J=Aduana(9)
function processRows(rows) {
  containers = [];
  const dataRows = rows.slice(1); // skip header row
  for (const row of dataRows) {
    if (!row || row.length < 4) continue;
 
    const carpeta  = String(row[0] || '').trim();
    const product  = String(row[1] || '').trim();
    const supplier = String(row[2] || '').trim();
    const bl       = String(row[3] || '').trim();
    const freight  = String(row[4] || '').trim();
    const etdRaw   = String(row[5] || '').trim();
    const etaRaw   = String(row[6] || '').trim();
    const daysLeft = String(row[7] || '').trim();
    const blPaid   = isChecked(row[8]);
    const customsPaid = isChecked(row[9]);
 
    // Skip blank rows and "Archivo" placeholder rows
    if (!bl || bl === 'BL' || carpeta.toLowerCase() === 'archivo' || (!product && !supplier)) continue;
 
    const etdDate = parseDate(etdRaw);
    const etaDate = parseDate(etaRaw);
    // ETA Toluca: column K if present, else ETA + 14 days for sea, same day for land
    let etaTolucaDate = row[10] ? parseDate(String(row[10])) : null;
    if (!etaTolucaDate && etaDate) {
      const isLandFreight = freight.toUpperCase().includes('COYOTE');
      etaTolucaDate = new Date(etaDate);
      if (!isLandFreight) etaTolucaDate.setDate(etaTolucaDate.getDate() + 14);
    }
 
    const arrived = daysLeft.toUpperCase() === 'EN PLANTA';
    const isMango = product.toLowerCase().includes('mango');
    const is40ft  = product.includes('40');
    const isLand  = freight.toUpperCase().includes('COYOTE');
 
    const progress = arrived ? 100 : calcProgress(etdDate, etaDate, isLand);
 
    containers.push({
      product, supplier, bl, freight,
      etd: etdDate, eta: etaDate, etaToluca: etaTolucaDate,
      daysLeft, blPaid, customsPaid,
      arrived, isMango, is40ft, isLand, progress
    });
  }
 
  renderDashboard();
}
 
function calcProgress(etdDate, etaDate, isLand) {
  try {
    if (!etdDate || !etaDate || isNaN(etdDate) || isNaN(etaDate)) return 10;
    const now = new Date();
    const total = etaDate - etdDate;
    const elapsed = now - etdDate;
    if (elapsed < 0) return 2;
    if (elapsed > total) return 98;
    return Math.round((elapsed / total) * 100);
  } catch { return 50; }
}
 
// ─── RENDER ───────────────────────────────────────────────────────────────
function renderDashboard() {
  const pending = containers.filter(c => !c.arrived);
  const arrived = containers.filter(c => c.arrived).sort((a,b) => (b.etaToluca||0) - (a.etaToluca||0));
 
  const totalPending = pending.length;
  const blPaidCount = containers.filter(c => c.blPaid).length;
  const customsPaidCount = containers.filter(c => c.customsPaid).length;
  const arrivedCount = arrived.length;
 
  let html = `
    <div class="kpi-grid">
      <div class="kpi c-blue">
        <div class="kpi-lbl">En tránsito</div>
        <div class="kpi-val">${totalPending}</div>
        <div class="kpi-sub">contenedores activos</div>
      </div>
      <div class="kpi c-green">
        <div class="kpi-lbl">BL Pagados</div>
        <div class="kpi-val">${blPaidCount}</div>
        <div class="kpi-sub">de ${containers.length} totales</div>
      </div>
      <div class="kpi c-purple">
        <div class="kpi-lbl">Aduana pagada</div>
        <div class="kpi-val">${customsPaidCount}</div>
        <div class="kpi-sub">despachos completos</div>
      </div>
      <div class="kpi c-amber">
        <div class="kpi-lbl">En planta</div>
        <div class="kpi-val">${arrivedCount}</div>
        <div class="kpi-sub">entregados</div>
      </div>
    </div>`;
 
  if (pending.length) {
    html += `<div class="sh">En tránsito — ${pending.length} contenedor${pending.length !== 1 ? 'es' : ''}</div>`;
    pending.forEach(c => { html += renderCard(c); });
  } else {
    html += `<div class="empty-state">No hay contenedores en tránsito.</div>`;
  }
 
  if (arrived.length) {
    html += `
      <div class="section-title" style="margin-top:28px">En planta — ${arrived.length} contenedor${arrived.length !== 1 ? 'es' : ''}</div>
      <button class="arrived-toggle" onclick="toggleArrived(this)">
        <span>📦 Historial de contenedores entregados</span>
        <span id="arrived-chevron">▼ ver</span>
      </button>
      <div id="arrived-list" style="display:none">
        <div class="arrived-grid">`;
    arrived.forEach(c => { html += renderCard(c, true); });
    html += `</div></div>`;
  }
 
  setContent(html);
}
 
function toggleArrived(btn) {
  arrivedOpen = !arrivedOpen;
  document.getElementById('arrived-list').style.display = arrivedOpen ? 'block' : 'none';
  document.getElementById('arrived-chevron').textContent = arrivedOpen ? '▲ ocultar' : '▼ ver';
}
 
function freightBadge(freight) {
  const f = freight.toUpperCase();
  if (f.includes('WAN HAI') || f.includes('WANHAI')) return `<span class="freight-logo freight-wanhai">🚢 WAN HAI</span>`;
  if (f.includes('ONE')) return `<span class="freight-logo freight-one">🚢 ONE</span>`;
  if (f.includes('MAERSK')) return `<span class="freight-logo freight-maersk">🚢 MAERSK</span>`;
  if (f.includes('HAPAG') || f.includes('HLCU')) return `<span class="freight-logo freight-hapag">🚢 HAPAG LLOYD</span>`;
  if (f.includes('COYOTE')) return `<span class="freight-logo freight-coyote">🚚 COYOTE</span>`;
  return `<span class="badge badge-supplier">${freight}</span>`;
}
 
function formatDate(d) {
  if (!d) return '—';
  try {
    const dt = (d instanceof Date) ? d : new Date(d);
    if (isNaN(dt)) return '—';
    return dt.toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
  } catch { return '—'; }
}
 
function daysLeftDisplay(c) {
  if (c.arrived) return `<span style="color:var(--green);font-weight:700">EN PLANTA</span>`;
  const n = parseInt(c.daysLeft);
  if (!isNaN(n) && n >= 0) {
    const color = n <= 3 ? 'var(--red)' : n <= 10 ? 'var(--amber)' : 'var(--pan-blue-light)';
    return `<span style="color:${color};font-weight:700">${n}d</span>`;
  }
  // Compute from ETA date
  if (c.eta) {
    const diff = Math.ceil((c.eta - new Date()) / 86400000);
    if (diff < 0) return `<span style="color:var(--amber);font-weight:700">En aduana</span>`;
    const color = diff <= 3 ? 'var(--red)' : diff <= 10 ? 'var(--amber)' : 'var(--pan-blue-light)';
    return `<span style="color:${color};font-weight:700">${diff}d</span>`;
  }
  return `<span style="color:var(--text3)">—</span>`;
}
 
function renderCard(c, compact = false) {
  const isMango = c.isMango;
  const icon = isMango ? '🥭' : '🍍';
  const iconClass = isMango ? 'mango' : 'pineapple';
  const sizeLabel = c.is40ft ? '40ft' : '20ft';
  const routeLabel = c.isLand ? 'Los Angeles → Laredo → Toluca' : 'Bangkok → Lázaro Cárdenas → Toluca';
 
  // ── TWO-STAGE PROGRESS BAR ─────────────────────────────────────────────
  // Sea leg  = 70% of bar width (ETD → ETA port)
  // Land leg = 30% of bar width (ETA port → ETA Toluca, ~14 days customs)
  // For Coyote (land-only): single bar, truck the whole way
  let progressBar;
 
  if (c.isLand) {
    // Land only — simple single bar
    const pct = c.arrived ? 100 : Math.max(2, Math.min(c.progress, 98));
    const iconPos = Math.max(2, Math.min(pct, 97));
    const waypoints = ['LA, EE.UU.', 'Laredo, TX', 'Toluca, MX'];
    const stage = c.arrived ? 2 : Math.floor((pct / 100) * 2);
    progressBar = `
      <div class="progress-container">
        <div class="progress-track-wrap">
          <div class="track-bg" style="left:0;width:100%;border-radius:5px"></div>
          <div class="track-fill seg-all-land" style="width:${pct}%"></div>
          <div class="transit-icon mode-land" style="left:${iconPos}%">🚛</div>
        </div>
        <div class="waypoints">
          ${waypoints.map((w,i) => `<div class="waypoint${i===stage?' active-land':''}">${w}</div>`).join('')}
        </div>
      </div>`;
  } else {
    // Sea + Land — two-stage bar
    const now = new Date();
    const etd = c.etd, eta = c.eta, etaToluca = c.etaToluca;
 
    // Determine which leg we're on
    const pastPort = eta && now >= eta;
    const atPlant  = c.arrived;
 
    // Sea leg progress (0–100% within first 70% of bar)
    let seaPct = 0; // 0-100 within the sea segment
    if (etd && eta) {
      const total = eta - etd;
      const elapsed = now - etd;
      seaPct = total > 0 ? Math.max(0, Math.min(100, Math.round((elapsed / total) * 100))) : 0;
    }
    if (pastPort || atPlant) seaPct = 100;
 
    // Land leg progress (0–100% within last 30% of bar)
    let landPct = 0;
    if (pastPort && eta && etaToluca) {
      const total = etaToluca - eta;
      const elapsed = now - eta;
      landPct = total > 0 ? Math.max(0, Math.min(100, Math.round((elapsed / total) * 100))) : 0;
    }
    if (atPlant) landPct = 100;
 
    // Widths as % of total bar
    const seaBarWidth  = (seaPct  / 100) * 70;   // 0–70%
    const landBarWidth = (landPct / 100) * 30;    // 0–30% within right section
 
    // Icon position as % of total bar
    let iconPct, iconMode;
    if (!pastPort) {
      // On sea leg — icon moves 0% → 70%
      iconPct  = Math.max(2, Math.min(seaBarWidth, 68));
      iconMode = 'mode-sea';
    } else {
      // On land leg — icon moves 70% → 100%
      iconPct  = Math.max(71, Math.min(70 + landBarWidth, 97));
      iconMode = 'mode-land';
    }
 
    const transitIcon = (!pastPort) ? '🚢' : '🚛';
 
    // Waypoints: Bangkok | Mar Pacífico | L. Cárdenas | Toluca
    // Active waypoint logic
    let activeIdx = 0;
    if (seaPct > 30 && !pastPort) activeIdx = 1;
    if (pastPort && landPct < 80) activeIdx = 2;
    if (atPlant || (pastPort && landPct >= 80)) activeIdx = 3;
    const waypoints = ['Bangkok, TH', 'Mar Pacífico', 'L. Cárdenas', 'Toluca, MX'];
 
    progressBar = `
      <div class="progress-container">
        <div class="progress-track-wrap">
          <div class="track-bg seg-sea"></div>
          <div class="track-bg seg-land"></div>
          <div class="port-divider"></div>
          <div class="track-fill seg-sea-fill"  style="width:${seaBarWidth.toFixed(1)}%"></div>
          <div class="track-fill seg-land-fill" style="width:${landBarWidth.toFixed(1)}%"></div>
          <div class="transit-icon ${iconMode}" style="left:${iconPct.toFixed(1)}%">${transitIcon}</div>
        </div>
        <div class="waypoints">
          ${waypoints.map((w,i) => {
            const cls = i === activeIdx ? (i >= 2 ? ' active-land' : ' active') : '';
            return `<div class="waypoint${cls}">${w}</div>`;
          }).join('')}
        </div>
      </div>`;
  }
 
  const statusBadges = [];
  if (c.blPaid) statusBadges.push(`<span class="badge badge-status-paid">✓ BL Pagado</span>`);
  else statusBadges.push(`<span class="badge badge-status-pending">⏳ BL Pendiente</span>`);
  if (c.customsPaid) statusBadges.push(`<span class="badge badge-customs">✓ Aduana</span>`);
 
  if (c.arrived) {
    return `
      <div class="container-card arrived">
        <div class="card-top">
          <div class="card-left">
            <div class="product-icon ${iconClass}">${icon}</div>
            <div class="bl-info">
              <div class="bl-number">${c.bl}</div>
              <div class="bl-meta">
                <span class="badge badge-size">${sizeLabel}</span>
                <span class="badge badge-supplier">${c.supplier}</span>
                <span class="badge badge-arrived">✓ En Planta</span>
              </div>
            </div>
          </div>
          <div class="card-right">
            ${freightBadge(c.freight)}
          </div>
        </div>
        <div class="dates-row">
          <div class="date-item"><div class="date-label">Llegó a planta</div><div class="date-value highlight">${formatDate(c.etaToluca)}</div></div>
          <div class="date-item"><div class="date-label">Llegó a puerto</div><div class="date-value">${formatDate(c.eta)}</div></div>
        </div>
      </div>`;
  }
 
  return `
    <div class="container-card">
      <div class="card-top">
        <div class="card-left">
          <div class="product-icon ${iconClass}">${icon}</div>
          <div class="bl-info">
            <div class="bl-number">${c.bl}</div>
            <div class="bl-meta">
              <span class="badge badge-size">${sizeLabel}</span>
              <span class="badge badge-supplier">${c.supplier}</span>
              ${freightBadge(c.freight)}
            </div>
          </div>
        </div>
        <div class="card-right">
          <div class="days-left">${daysLeftDisplay(c)}</div>
          <div class="days-label">al puerto</div>
          <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${statusBadges.join('')}</div>
        </div>
      </div>
      ${progressBar}
      <div class="dates-row" style="margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
        <div class="date-item"><div class="date-label">ETD (salida)</div><div class="date-value">${formatDate(c.etd)}</div></div>
        <div class="date-item"><div class="date-label">ETA Puerto</div><div class="date-value highlight">${formatDate(c.eta)}</div></div>
        <div class="date-item"><div class="date-label">Est. Toluca</div><div class="date-value">${formatDate(c.etaToluca)}</div></div>
        <div class="date-item"><div class="date-label">Ruta</div><div class="date-value" style="font-size:11px;color:var(--text3)">${routeLabel}</div></div>
      </div>
    </div>`;
}
 
 
// ── THEME ────────────────────────────────────────────────────────────────
function toggleTheme(chk) {
  const thumb = document.getElementById('toggle-thumb');
  if (chk.checked) {
    document.getElementById('root').classList.add('light');
    thumb.textContent = '☀️';
    localStorage.setItem('pan_theme', 'light');
  } else {
    document.getElementById('root').classList.remove('light');
    thumb.textContent = '🌙';
    localStorage.setItem('pan_theme', 'dark');
  }
}
// Restore saved theme on load
(function(){
  const saved = localStorage.getItem('pan_theme');
  if (saved === 'light') {
    document.getElementById('root').classList.add('light');
    const chk = document.getElementById('theme-chk');
    const thumb = document.getElementById('toggle-thumb');
    if (chk) chk.checked = true;
    if (thumb) thumb.textContent = '☀️';
  }
})();
 
// ─── INIT ─────────────────────────────────────────────────────────────────
loadData();
// Auto-refresh every 5 minutes
setInterval(loadData, 5 * 60 * 1000);
</script>
